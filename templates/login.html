<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Steby Varghese</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon_icon_1766679969783.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="gradient-bg">
        <div class="stars-3d-container">
            <div class="stars-layer stars-layer-1"></div>
            <div class="stars-layer stars-layer-2"></div>
            <div class="stars-layer stars-layer-3"></div>
        </div>
    </div>

    <div style="display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; position: relative; z-index: 10;">
        <div class="glass-card login-card">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div class="logo" style="margin-bottom: 1rem;"><span class="text-gradient">ADMIN</span>.PORTAL</div>
            <p style="color: var(--text-dim);">Please sign in to continue</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div
            style="background: rgba(255, 0, 0, 0.1); color: #ff4d4d; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid rgba(255, 0, 0, 0.2);">
            <i class="fas fa-exclamation-circle" style="margin-right: 0.5rem;"></i> {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; margin-top: 1rem;">
                Sign In
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="{{ url_for('index') }}" style="color: var(--text-dim); text-decoration: none; font-size: 0.9rem;">
                <i class="fas fa-arrow-left"></i> Back to Portfolio
            </a>
        </div>
    </div>



    </div>
</body>

</html>
